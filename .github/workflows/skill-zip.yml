# Builds electrum-skill.zip, the uploadable skill for Claude Desktop chat and Cowork, and
# attaches it to the GitHub release. Permanent link to the newest build:
#   https://github.com/yoelf22/electrum/releases/latest/download/electrum-skill.zip
name: Build skill zip
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble skill
        run: |
          set -e
          mkdir -p dist/electrum
          cp .claude/skills/electrum/SKILL.md README.md CHANGELOG.md dist/electrum/
          cp -r templates reference scripts dist/electrum/
          # Need a browser, an API key or the examples folder; not part of the uploaded skill.
          rm -f dist/electrum/scripts/generate_illustration.py dist/electrum/scripts/build_word_forms.py
          find dist/electrum -name '__pycache__' -prune -exec rm -rf {} +
          n=$(find dist/electrum -type f | wc -l); echo "files: $n"; [ "$n" -lt 200 ]
          cd dist && zip -qr electrum-skill.zip electrum && ls -lh electrum-skill.zip
      - uses: actions/upload-artifact@v4
        with:
          name: electrum-skill
          path: dist/electrum-skill.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/electrum-skill.zip
